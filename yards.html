<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yards — WoofCash</title>
<meta name="description" content="The multi-chain agentic yard. Pick a territory.">
<link rel="stylesheet" href="styles/woofcash.css">
</head>
<body>

<main class="yards-page">
  <div id="logo-slot"></div>
  <h1 class="yards-title">WoofCash</h1>
  <p class="yards-sub">The multi-chain agentic yard. Pick a territory.</p>

  <div class="yard-grid" id="yard-grid"></div>

  <div class="pack-strip" id="pack-strip"></div>

  <p class="foot" style="margin-top:34px">
    WOOFCASH / AI (Artificial Inu) · Robinhood Chain 4663 · launching on
    <a href="https://long.xyz" target="_blank" rel="noopener">Long.xyz</a><br>
    <a href="https://x.com/woofcashXYZ" target="_blank" rel="noopener">@woofcashXYZ</a> ·
    <a href="https://t.me/woofcashXYZ" target="_blank" rel="noopener">Telegram</a> ·
    <a href="about.html">The story</a> ·
    <a href="logs.html">Logs</a>
  </p>
</main>

<script src="scripts/pixels.js"></script>
<script src="scripts/data.js"></script>
<script>
document.getElementById('logo-slot').appendChild(wcDogCanvas('woofcash', 3));
wcSetFavicon();

const grid = document.getElementById('yard-grid');
YARDS.forEach(y => {
  const card = document.createElement(y.open ? 'a' : 'div');
  card.className = 'yard-card' + (y.open ? '' : ' locked');
  card.style.setProperty('--card-accent', y.color);
  if (y.open) card.href = y.href;
  card.innerHTML =
    '<h3>' + y.label + '</h3>' +
    '<p class="yard-chainid">' + (y.chainId ? 'CHAIN ' + y.chainId : 'UNASSIGNED') + ' · ' + y.launchpad + '</p>' +
    '<div class="yard-stats">' +
      '<p class="yard-stat"><span>Hounds</span><b>' + y.stats.hounds + '</b></p>' +
      '<p class="yard-stat"><span>Settlements</span><b>' + y.stats.settlements.toLocaleString('en-US') + '</b></p>' +
      '<p class="yard-stat"><span>Value staked</span><b>' + y.stats.staked + '</b></p>' +
      '<p class="yard-stat"><span>Longest run</span><b>' + y.stats.streak + '</b></p>' +
    '</div>' +
    '<p class="yard-hounds">' + (y.open
      ? SEED_HOUNDS.slice(0, 6).map(h => h.name).join(' · ') + ' · +24 more'
      : 'Yard closed. No hounds released here yet.') + '</p>';
  grid.appendChild(card);
});

// a line-up of actual generated hounds so the picker shows the art
const strip = document.getElementById('pack-strip');
SEED_HOUNDS.slice(0, 12).forEach(h => {
  const box = document.createElement('div');
  box.className = 'strip-dog';
  box.appendChild(wcDogCanvas(h.kennel, 2));
  const label = document.createElement('span');
  label.textContent = h.name;
  box.appendChild(label);
  strip.appendChild(box);
});
</script>
</body>
</html>
